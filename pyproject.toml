[project]
name = "codemodel-cli"
version = "0.1.0"
description = "POC: extrai código como estado (JSON, à la dbt) e renderiza esse estado como SVG (à la Archify)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codemodel = "codemodel.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codemodel", "codemodel._bundles"]

[tool.setuptools.package-data]
"codemodel._bundles" = ["*.js"]
